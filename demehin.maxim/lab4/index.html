<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Лабораторная работа 4</h1>

      <form data-testid="entity-form">
        <input type="number" name="id" placeholder="ID" required />
        <input type="text" name="name" placeholder="Имя" required />
        <button type="submit">Добавить студента</button>
      </form>

      <form data-testid="grade-form">
        <input type="number" name="id" placeholder="ID студента" required />
        <input type="text" name="subject" placeholder="Предмет" required />
        <input
          type="number"
          name="grade"
          placeholder="Оценка"
          min="1"
          max="5"
          required
        />
        <button type="submit">Добавить оценку</button>
      </form>

      <form data-testid="remove-grade-form">
        <input type="number" name="id" placeholder="ID студента" required />
        <input type="text" name="subject" placeholder="Предмет" required />
        <button type="submit">Удалить оценку</button>
      </form>

      <section>
        <button class="analytics-btn-subjects" type="button">
          Все предметы
        </button>
        <button class="analytics-btn-top" type="button">Лучшие студенты</button>
        <div class="analytics"></div>
      </section>

      <section
        data-testid="entity-list"
        aria-label="Список элементов"
      ></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
